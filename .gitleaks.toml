# One recorded exception (DEC-T07-GITLEAKS-EXCEPTION). All of gitleaks' built-in rules apply.
# The only lines allowed are Genesis file fingerprints in .genesis/project.json, and only for the
# generic-api-key rule: a quoted file path with an extension, then a quoted 64-character lowercase hex value.
# Every other rule still applies to those lines, and every rule applies everywhere else.
# Any wider exception needs a new decision record.
[extend]
useDefault = true

[[allowlists]]
description = "Genesis base_manifest file fingerprints in .genesis/project.json (DEC-T07-GITLEAKS-EXCEPTION)"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(^|/)\.genesis/project\.json$''']
regexTarget = "line"
regexes = ['''^\s*"[A-Za-z0-9._/-]+\.[A-Za-z0-9]{1,8}": "[0-9a-f]{64}",?\s*$''']
